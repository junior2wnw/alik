name: Melborda archive recovery

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/mel_recovery.py'
      - 'requirements.txt'
      - '.github/workflows/mel-recovery.yml'

permissions:
  contents: read

tasks:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MAX_LIVE_PAGES: '1600'
      MAX_ARCHIVE_PAGES: '1300'
      MAX_CC_PAGES: '650'
      MAX_CANDIDATES: '2200'
      MAX_RECOVERED_BYTES: '500000000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run recovery collector
        run: python tools/mel_recovery.py
      - name: Pack evidence
        if: always()
        run: |
          if [ -d mel-recovery-output ]; then
            tar -czf mel-recovery-output.tar.gz mel-recovery-output
          fi
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mel-recovery-output
          path: |
            mel-recovery-output/
            mel-recovery-output.tar.gz
          retention-days: 14
          if-no-files-found: warn
