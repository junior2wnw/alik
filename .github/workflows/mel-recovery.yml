name: Melborda archive recovery

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/mel_recovery.py'
      - 'requirements.txt'
      - '.github/workflows/mel-recovery.yml'
      - '.github/mel-recovery-run.txt'
  pull_request:
    branches: [master]
    paths:
      - 'tools/mel_recovery.py'
      - 'requirements.txt'
      - '.github/workflows/mel-recovery.yml'
      - '.github/mel-recovery-run.txt'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MAX_LIVE_PAGES: '1800'
      MAX_ARCHIVE_PAGES: '1500'
      MAX_CC_PAGES: '750'
      MAX_CANDIDATES: '2600'
      MAX_RECOVERED_BYTES: '400000000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full recovery collector
        run: python tools/mel_recovery.py 2>&1 | tee mel-recovery-run.log
      - name: Preserve run log
        if: always()
        run: |
          mkdir -p mel-recovery-output
          cp mel-recovery-run.log mel-recovery-output/run.log 2>/dev/null || true
      - name: Remove bulky raw indexes before persistence
        if: always()
        run: rm -rf mel-recovery-output/raw || true
      - name: Pack evidence
        if: always()
        run: |
          if [ -d mel-recovery-output ]; then
            tar -czf mel-recovery-output.tar.gz mel-recovery-output
          fi
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mel-recovery-output
          path: |
            mel-recovery-output/
            mel-recovery-output.tar.gz
          retention-days: 30
          if-no-files-found: warn
      - name: Persist evidence to results branch
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ ! -d mel-recovery-output ]; then exit 0; fi
          git config user.name 'mel-recovery-bot'
          git config user.email 'mel-recovery-bot@users.noreply.github.com'
          git checkout -B mel-recovery-results
          git add -f mel-recovery-output
          git commit -m "Update complete Melborda recovery evidence" || true
          git push --force origin mel-recovery-results
